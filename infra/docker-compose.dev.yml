# Local development services. Apps run on the host with `pnpm dev`.
# Usage: pnpm db:up   (or: docker compose -f infra/docker-compose.dev.yml up -d)
name: shop-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - '5433:5432' # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI: http://localhost:8025
      - '1025:1025' # SMTP

volumes:
  postgres-data:
